[project]
name = "ai_engineering_foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anthonyramirez82214-alt", email = "anthonyramirez82214@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ai_engineering_foundations = "ai_engineering_foundations.main:main"

[build-system]
